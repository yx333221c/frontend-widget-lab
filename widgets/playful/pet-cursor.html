<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>跟随的小宠物 · Widget Lab</title>
<style>
  :root {
    --accent: #ff5f9e;
    --ink: #e9edf6;
    --dim: #8695b4;
    --fur: #ff5f9e;
    --fur-dk: #cf3f77;
    --fur-lt: #ffd3e3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 22px 20px;
    background:
      radial-gradient(120% 110% at 8% -18%, #2a1a2c 0%, transparent 60%),
      radial-gradient(90% 90% at 100% 118%, #1a2536 0%, transparent 55%),
      #0e1119;
    color: var(--ink);
    font: 14px/1.5 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  h2 { margin: 0 0 2px; font-size: 15px; line-height: 1.3; letter-spacing: -.2px; }
  p.note { margin: 0 0 9px; color: var(--dim); font-size: 12.5px; }

  /* ============ 演示区：猫在这里活动 ============ */
  .stage {
    position: relative; height: 128px; overflow: hidden;
    border-radius: 12px; touch-action: none; cursor: crosshair;
    background:
      linear-gradient(180deg, transparent 0 74%, rgba(255, 255, 255, .03) 74% 100%),
      rgba(255, 255, 255, .03);
    border: 1px solid rgba(255, 255, 255, .1);
  }
  .floor {
    position: absolute; left: 0; right: 0; bottom: 26px; height: 1px;
    background: rgba(255, 255, 255, .12);
  }

  /* 状态面板：实时打印状态机，本身就是教学内容 */
  .probe {
    position: absolute; left: 9px; top: 8px; z-index: 5; pointer-events: none;
    font: 10.5px/1.6 ui-monospace, Consolas, monospace; color: var(--dim);
    background: rgba(14, 17, 25, .55); border: 1px solid rgba(255, 255, 255, .08);
    border-radius: 8px; padding: 4px 8px; min-width: 128px;
  }
  .probe b { color: var(--accent); font-weight: 600; }
  .probe .st { color: #bff0d6; }

  /* ============ 纯 CSS 的猫 ============ */
  .pet {
    position: absolute; left: 0; top: 0; width: 0; height: 0;
    will-change: transform;
  }
  .bob { position: absolute; will-change: transform; }

  /* 斜杠语法：前四个值是水平半径，后四个是垂直半径，
     同一角上两者可以差很多 —— 这就是有机形状的来源 */
  .head {
    position: absolute; left: -23px; top: -46px; width: 46px; height: 40px;
    border-radius: 50% 50% 42% 42% / 58% 58% 42% 42%;
    background: linear-gradient(160deg, var(--fur) 0%, var(--fur-dk) 100%);
    z-index: 3;
  }
  .ear {
    position: absolute; width: 15px; height: 16px; z-index: 2;
    background: var(--fur-dk);
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
  }
  .ear.l { left: -20px; top: -52px; transform: rotate(-14deg); }
  .ear.r { left: 6px; top: -52px; transform: rotate(14deg); }
  .ear i {
    position: absolute; left: 4px; top: 6px; width: 7px; height: 9px;
    background: var(--fur-lt);
    clip-path: polygon(50% 0, 100% 100%, 0 100%);
  }
  .eye {
    position: absolute; top: -34px; width: 9px; height: 9px; z-index: 4;
    border-radius: 50%;
    background: rgba(255, 255, 255, .92);
    display: grid; place-items: center;
    overflow: hidden;
  }
  .eye.l { left: -14px; }
  .eye.r { left: 4px; }
  .pupil {
    display: block; width: 7px; height: 8px; border-radius: 50%;
    background: #141824;
    transform-origin: 50% 50%;
    /* 眨眼 = 瞳孔竖向压扁；闭眼值由 JS 写 scaleY，见教学 §2 */
    transform: scaleY(1);
  }
  .nose {
    position: absolute; top: -23px; left: -3px; width: 7px; height: 5px; z-index: 4;
    background: var(--fur-lt);
    clip-path: polygon(0 0, 100% 0, 50% 100%);
  }
  .mouth {
    position: absolute; top: -19px; left: -3px; width: 7px; height: 3px; z-index: 4;
    border-radius: 0 0 50% 50%;
    background: rgba(20, 24, 36, .8);
    transform: scaleY(0.2);
    transform-origin: 50% 0;
  }
  .whisk {
    position: absolute; top: -24px; width: 13px; height: 1px; z-index: 4;
    background: rgba(255, 255, 255, .4);
    border-radius: 1px;
  }
  .whisk.l { left: -27px; transform: rotate(-6deg); }
  .whisk.r { left: 15px; transform: rotate(6deg); }

  .body {
    position: absolute; left: -20px; top: -22px; width: 40px; height: 24px; z-index: 2;
    border-radius: 46% 54% 40% 40% / 62% 60% 40% 40%;
    background: linear-gradient(170deg, var(--fur) 0%, var(--fur-dk) 92%);
  }
  .body::after {                       /* 肚皮高光 */
    content: ""; position: absolute; left: 8px; top: 10px; width: 22px; height: 12px;
    border-radius: 50% 50% 46% 46% / 70% 70% 30% 30%;
    background: rgba(255, 211, 227, .35);
  }
  .paw {
    position: absolute; top: -8px; width: 11px; height: 8px; z-index: 2;
    border-radius: 50% 50% 42% 42% / 76% 76% 24% 24%;
    background: var(--fur-lt);
    will-change: transform;
  }
  .paw.a { left: -16px; }
  .paw.b { left: -4px; }

  .tail {
    position: absolute; left: 16px; top: -18px; width: 30px; height: 7px; z-index: 1;
    border-radius: 4px 8px 8px 4px / 4px 7px 7px 4px;
    background: linear-gradient(90deg, var(--fur-dk), var(--fur));
    transform-origin: 0% 50%;            /* 绕根部转，见教学 §3 */
    will-change: transform;
  }
  .tail i {
    position: absolute; right: -2px; top: -1px; width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--fur-lt);
  }

  /* 坐下：身体变竖、头抬高、尾巴卷到身前。只改 transform / border-radius，
     不碰 width height，避免每帧触发 layout */
  .pet.sitting .body { transform: translateY(-4px) scale(1.02, 1.18); }
  .pet.sitting .head { transform: translateY(-6px); }
  .pet.sitting .tail { transform-origin: 0% 50%; }
  .pet.sitting .paw { top: -4px; }

  /* 干鱼：身体 + 尾巴，纯 CSS，无图片 */
  .fish {
    position: absolute; left: 0; top: 0; width: 22px; height: 12px; z-index: 1;
    transform: translate(-50%, -50%);
    opacity: 0; transition: opacity .2s;
  }
  .fish.on { opacity: 1; }
  .fish::before {
    content: ""; position: absolute; left: 0; top: 0; width: 17px; height: 12px;
    border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
    background: linear-gradient(180deg, #f6c66f, #cf8b3a);
  }
  .fish::after {
    content: ""; position: absolute; left: 15px; top: 2px; width: 9px; height: 9px;
    background: #cf8b3a;
    clip-path: polygon(0 50%, 100% 0, 100% 100%);
  }

  /* ============ 控制面板 ============ */
  .panel {
    margin-top: 8px; padding: 8px 12px; border-radius: 12px;
    background: rgba(255, 255, 255, .04); border: 1px solid rgba(255, 255, 255, .1);
    display: flex; flex-wrap: wrap; gap: 7px 14px; align-items: center;
    font-size: 12px; color: #a9b6d1;
  }
  .panel label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .panel input[type="range"] { width: 86px; accent-color: var(--accent); }
  .panel output { font: 11px/1 ui-monospace, Consolas, monospace; color: var(--ink); min-width: 30px; }
  .chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .chk input { accent-color: var(--accent); }
  .panel button {
    padding: 4px 11px; border-radius: 8px; cursor: pointer; font-size: 12px;
    color: var(--ink); background: rgba(255, 95, 158, .14);
    border: 1px solid rgba(255, 95, 158, .4);
  }
  .panel button:hover { background: rgba(255, 95, 158, .24); }
  .panel button[disabled] { opacity: .45; cursor: default; }
  p.hint { margin: 7px 0 0; color: #6c7893; font-size: 11.5px; }
  code { font: 11.5px ui-monospace, Consolas, monospace; color: #b8c6e6; }

  body.still .pet, body.still .pupil, body.still .tail { transition: none; }
  @media (prefers-reduced-motion: reduce) {
    .fish { transition: none; }
  }
</style>
</head>
<body>
  <h2>跟随的小宠物 Pet Cursor</h2>
  <p class="note">在灰色区域移动指针它就跟过来；触屏就点一下落点。默认坐着眨眼，不会一进页面就乱跑。</p>

  <div class="stage" id="stage">
    <div class="probe" id="probe">state <b class="st">sit</b><br>speed <b>0</b><br>dist <b>0</b><br>tail φ <b>0.00</b></div>
    <div class="floor"></div>

    <div class="fish" id="fish"></div>

    <div class="pet sitting" id="pet" aria-hidden="true">
      <div class="bob" id="bob">
        <div class="tail" id="tail"><i></i></div>
        <div class="body"></div>
        <div class="paw a" id="pawA"></div>
        <div class="paw b" id="pawB"></div>
        <div class="head"></div>
        <div class="ear l"></div>
        <div class="ear r"></div>
        <div class="eye l"><b class="pupil" id="eyeL"></b></div>
        <div class="eye r"><b class="pupil" id="eyeR"></b></div>
        <div class="nose"></div>
        <div class="mouth" id="mouth"></div>
        <div class="whisk l"></div>
        <div class="whisk r"></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <label>速度
      <input type="range" id="sSpeed" min="40" max="420" step="10" value="180" aria-label="跟随速度上限">
      <output id="oSpeed">180</output>
    </label>
    <label class="chk"><input type="checkbox" id="cSecond" checked> 次级运动（尾巴滞后）</label>
    <button type="button" id="bFeed">喂干鱼</button>
    <label class="chk"><input type="checkbox" id="cStill"> 静止（停 rAF）</label>
  </div>
  <p class="hint">关掉「次级运动」时，尾巴和身体同相位摆动 —— 一眼就假。速度拉到 <code>420</code> 会看到它一路狂奔到指针处并急停。</p>

<script>
(function () {
  'use strict';

  var stage = document.getElementById('stage');
  var pet = document.getElementById('pet');
  var bob = document.getElementById('bob');
  var tail = document.getElementById('tail');
  var pawA = document.getElementById('pawA'), pawB = document.getElementById('pawB');
  var eyeL = document.getElementById('eyeL'), eyeR = document.getElementById('eyeR');
  var mouth = document.getElementById('mouth');
  var fish = document.getElementById('fish');
  var probe = document.getElementById('probe');

  var CFG = {
    follow: 4.5,      // 「距离越大越快」的斜率：每帧追近距离的 4.5 倍距离/秒
    maxSpeed: 180,    // 位移上限 px/s：再远也只跑这么快（§4）
    arrive: 9,        // 到达半径：低于它就直接停，不做无限逼近
    second: true      // 次级运动开关
  };
  CFG.runAt = CFG.maxSpeed * 0.66;
  var still = false;

  /* ============ 状态机 ============
     一个状态一个对象，enter / exit 成对；blink 与 eat 是带时限的临时态。
     任何切换都先 exit 旧状态、再 enter 新状态 —— §2 讲的那条竞争就靠这个挡。 */
  function noop() {}
  var STATES = {
    sit:  { enter: function () { pet.classList.add('sitting'); },
            exit:  function () { pet.classList.remove('sitting'); } },
    idle: { enter: noop, exit: noop },
    walk: { enter: noop, exit: noop },
    run:  { enter: noop, exit: noop }
  };
  var state = 'sit';
  var transient = null;          // 'blink' | 'eat' | null
  var until = 0;                 // 临时态到期时间
  var blinkNext = 0;             // 下一次眨眼的起始时间
  var lid = 1;                   // 1 = 睁眼，0.06 = 闭上

  function swap(next) {                 // 只换表现层，不动临时态
    if (next === state) return;
    STATES[state].exit();
    STATES[next].enter();
    state = next;
  }
  function set(next) {
    if (transient) return;              // 临时态期间禁止切换：眨眼中途不会被换成 run
    swap(next);
  }
  function enterBlink(now) {
    transient = 'blink';
    until = now + 130;
    lid = 0.06;
    blinkNext = now + 2600 + Math.random() * 2400;
  }
  function enterEat(now) {
    transient = 'eat';
    until = now + 1100;
    swap('idle');                       // 进餐时主动切到站姿，绕过 set 的保护
  }
  function leaveTransient() {
    if (transient === 'blink') lid = 1;              // 关键：把眼睛重新睁开
    if (transient === 'eat') { mouth.style.transform = 'scaleY(0.2)'; hideFish(); target.pin = false; }
    transient = null;
  }

  /* ============ 位置与目标 ============ */
  var pos = { x: 70, y: 96 }, vel = { x: 0, y: 0 };
  var target = { x: 70, y: 96, has: false, pin: false };
  var face = 1, phase = 0;
  var W = 0, H = 0;

  function measure() {
    var b = stage.getBoundingClientRect();
    W = Math.max(1, b.width); H = Math.max(1, b.height);
  }
  measure();
  var dirty = true;
  window.addEventListener('resize', function () { dirty = true; kick(); });
  window.addEventListener('scroll', function () { dirty = true; }, { passive: true });

  function clampPos() {
    pos.x = Math.max(32, Math.min(W - 32, pos.x));
    pos.y = Math.max(64, Math.min(H - 16, pos.y));
  }

  /* 触屏没有 hover：点哪儿它去哪儿，并钉在那儿直到吃完 */
  stage.addEventListener('pointerdown', function (e) {
    var b = stage.getBoundingClientRect();
    target.x = e.clientX - b.left; target.y = e.clientY - b.top;
    target.has = true;
    if (e.pointerType === 'touch') target.pin = true;
    kick();
  });
  stage.addEventListener('pointermove', function (e) {
    if (e.pointerType === 'touch') return;
    var b = stage.getBoundingClientRect();
    target.x = e.clientX - b.left; target.y = e.clientY - b.top;
    target.has = true; target.pin = false;
    kick();
  }, { passive: true });
  stage.addEventListener('pointerleave', function () {
    if (!target.pin) { target.has = false; kick(); }
  });

  /* ============ 干鱼 ============ */
  var fishOn = false, fishPos = { x: 0, y: 0 };
  function showFish(x, y) {
    fishPos.x = x; fishPos.y = y; fishOn = true;
    fish.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    fish.classList.add('on');
  }
  function hideFish() { fishOn = false; fish.classList.remove('on'); }
  document.getElementById('bFeed').addEventListener('click', function () {
    if (still) return;
    showFish(50 + Math.random() * (W - 100), H - 30 - Math.random() * 26);
    target.x = fishPos.x; target.y = fishPos.y; target.has = true; target.pin = true;
    kick();
  });

  /* ============ 每帧 ============ */
  var raf = null, lastT = 0, wakeTimer = null;
  function frame(t) {
    if (dirty) { measure(); clampPos(); dirty = false; }
    var ms = Math.min(40, lastT ? t - lastT : 16.7);   // 夹住一帧：切后台回来不能瞬移
    var dtN = ms / 16.6667;                            // 折算成「60fps 帧」
    var dtS = ms / 1000;                               // 秒
    lastT = t;

    var tx = target.has ? target.x : pos.x;
    var ty = target.has ? target.y : pos.y;
    var dx = tx - pos.x, dy = ty - pos.y;
    var dist = Math.hypot(dx, dy);

    /* --- 带上限的 lerp（§4）---
       纯 lerp 是 pos += (target-pos)*k，速度正比于距离：距离 600px 时一帧跨 100px，
       宠物会一路抖到指针上。夹一个 maxSpeed 就把「越远越快」限制在远处，
       近处仍然是 lerp 的平滑收尾。到达半径内直接归零，不做无限逼近。 */
    var want = 0;
    if (target.has && dist > CFG.arrive && transient !== 'eat') {
      want = Math.min(dist * CFG.follow, CFG.maxSpeed);
    }
    if (dist > 0.001 && want > 0) {
      vel.x = (dx / dist) * want; vel.y = (dy / dist) * want;
    } else { vel.x = 0; vel.y = 0; }
    pos.x += vel.x * dtS; pos.y += vel.y * dtS;
    var speed = Math.hypot(vel.x, vel.y);
    clampPos();

    /* --- 状态判定：临时态期间不切换，见 §2 --- */
    if (!transient) {
      if (!target.has) set('sit');
      else if (speed < 2) set(dist > CFG.arrive * 1.5 ? 'idle' : 'sit');
      else set(speed > CFG.runAt ? 'run' : 'walk');
    }

    /* 朝向只在真的移动时翻，否则每帧抖方向 */
    if (Math.abs(vel.x) > 6) face = vel.x > 0 ? 1 : -1;

    /* --- 眨眼：与状态无关的独立到点检查（§2） --- */
    if (transient === 'blink' && t >= until) leaveTransient();
    if (!transient && (state === 'sit' || state === 'idle') && t >= blinkNext) enterBlink(t);

    /* --- 吃鱼：靠近钉住的鱼就进临时态 --- */
    if (fishOn && target.pin && !transient && dist < CFG.arrive * 1.4) enterEat(t);
    if (transient === 'eat' && t >= until) leaveTransient();

    /* --- 步态相位：频率由速度决定 --- */
    var gait = Math.min(1, speed / 200);
    if (speed > 4) phase += dtN * (0.24 + 0.5 * gait);

    /* --- 次级运动：身体用 phase，尾巴用 phase - 0.4（§3） --- */
    var bobY = Math.sin(phase) * 2.6 * gait;
    var bodyAng = Math.sin(phase) * 4 * gait;
    var tailPhase = CFG.second ? phase - 0.4 : phase;
    var tailSwing = Math.sin(tailPhase) * 16 * (0.35 + gait) + bodyAng * 0.3;
    var tailAng = (state === 'sit' && !target.has) ? 62 + Math.sin(tailPhase) * 5 : tailSwing;
    var pawShift = Math.sin(phase) * 4 * gait;
    var pawLift = (1 - Math.cos(phase * 2)) * 1.6 * gait;

    /* --- 写样式：每帧只碰 transform，不碰宽高，避免 forced layout --- */
    pet.style.transform = 'translate3d(' + pos.x.toFixed(2) + 'px,' + pos.y.toFixed(2) + 'px,0) scaleX(' + face + ')';
    bob.style.transform = 'translate3d(0,' + bobY.toFixed(2) + 'px,0) rotate(' + bodyAng.toFixed(2) + 'deg)';
    tail.style.transform = 'rotate(' + tailAng.toFixed(2) + 'deg)';
    pawA.style.transform = 'translate3d(' + pawShift.toFixed(2) + 'px,' + (-pawLift).toFixed(2) + 'px,0)';
    pawB.style.transform = 'translate3d(' + (-pawShift).toFixed(2) + 'px,' + (-pawLift * 0.6).toFixed(2) + 'px,0)';
    eyeL.style.transform = eyeR.style.transform = 'scaleY(' + lid + ')';
    if (transient === 'eat') mouth.style.transform = 'scaleY(' + (0.2 + 0.8 * Math.abs(Math.sin(phase * 3))).toFixed(2) + ')';

    /* --- 面板：状态机实时可见，本身就是教学内容 --- */
    probe.innerHTML = 'state <b class="st">' + (transient || state) + '</b>' +
      '<br>speed <b>' + Math.round(speed) + '</b>' +
      '<br>dist <b>' + Math.round(dist) + '</b>' +
      '<br>body φ <b>' + phase.toFixed(2) + '</b>' +
      '<br>tail φ <b>' + tailPhase.toFixed(2) + '</b>';

    /* --- 静止判定：没速度、没临时态、也没到点的眨眼 —— 停掉 rAF --- */
    var settled = speed < 2 && !transient && (!target.has || dist <= CFG.arrive + 1);
    if (!still && !settled) raf = requestAnimationFrame(frame);
    else { raf = null; lastT = 0; sleep(); }
  }

  /* 停摆期间用 setTimeout 约下一次眨眼，rAF 这段时间完全不排 */
  function sleep() {
    clearTimeout(wakeTimer);
    if (still) return;
    var wait = Math.max(120, Math.min(6000, blinkNext - performance.now()));
    wakeTimer = setTimeout(kick, wait);
  }
  function kick() {
    clearTimeout(wakeTimer); wakeTimer = null;
    if (still) return;
    if (!raf) { lastT = 0; raf = requestAnimationFrame(frame); }
  }

  /* ============ 控件 ============ */
  var sp = document.getElementById('sSpeed');
  sp.addEventListener('input', function () {
    CFG.maxSpeed = parseFloat(sp.value);
    CFG.runAt = CFG.maxSpeed * 0.66;
    document.getElementById('oSpeed').textContent = sp.value;
    kick();
  });
  document.getElementById('cSecond').addEventListener('change', function () {
    CFG.second = this.checked;
    kick();
  });
  var stillBox = document.getElementById('cStill');
  stillBox.addEventListener('change', function () {
    still = stillBox.checked;
    document.body.classList.toggle('still', still);
    document.getElementById('bFeed').disabled = still;
    if (still) {
      if (raf) cancelAnimationFrame(raf);
      raf = null; clearTimeout(wakeTimer); wakeTimer = null;
      if (transient) leaveTransient();
      hideFish();
      eyeL.style.transform = eyeR.style.transform = 'scaleY(1)';
      bob.style.transform = tail.style.transform = pawA.style.transform = pawB.style.transform = '';
      probe.innerHTML = 'state <b class="st">still</b><br>speed <b>0</b><br>rAF <b>停</b>';
    } else kick();
  });
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
    stillBox.checked = true;
    stillBox.dispatchEvent(new Event('change'));
  }

  measure(); clampPos();
  blinkNext = performance.now() + 900;
  kick();
})();
</script>
</body>
</html>
