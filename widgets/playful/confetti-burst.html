<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>点击撒花 · Widget Lab</title>
<style>
  :root {
    --accent: #f7b955;
    --ink: #e9edf6;
    --dim: #8695b4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 22px 20px;
    background:
      radial-gradient(120% 100% at 8% -20%, #212840 0%, transparent 58%),
      radial-gradient(90% 90% at 100% 120%, #2b2338 0%, transparent 55%),
      #0e1119;
    color: var(--ink);
    font: 14px/1.55 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  h2 { margin: 0 0 3px; font-size: 15px; line-height: 1.3; letter-spacing: -.2px; }
  p.note { margin: 0 0 10px; color: var(--dim); font-size: 12.5px; }

  /* ---------- 演示区 ---------- */
  .stage {
    position: relative; height: 112px; overflow: hidden;
    border-radius: 12px;
    background: rgba(255, 255, 255, .03);
    border: 1px solid rgba(255, 255, 255, .1);
    touch-action: none;
  }
  /* canvas 盖在按钮上方，但 pointer-events:none —— 粒子层永远不吃点击 */
  .stage canvas {
    position: absolute; inset: 0; z-index: 2;
    pointer-events: none; display: block;
  }
  .burst {
    position: absolute; left: 50%; top: 50%; z-index: 1;
    transform: translate(-50%, -50%);
    padding: 13px 30px; border-radius: 999px; cursor: pointer;
    font: 700 15px/1 system-ui, "PingFang SC", sans-serif; letter-spacing: .3px;
    color: #1a1305;
    background: linear-gradient(180deg, #ffd48a, var(--accent));
    border: 1px solid #ffe3b0;
    box-shadow: 0 10px 26px -12px rgba(247, 185, 85, .8), inset 0 1px 0 rgba(255, 255, 255, .6);
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s cubic-bezier(.2, .8, .25, 1), filter .2s;
  }
  .burst:hover { filter: brightness(1.08); }
  .burst:active { transform: translate(-50%, -50%) scale(.94); }
  .burst[disabled] { filter: grayscale(.8) brightness(.7); cursor: default; }
  .meter {
    position: absolute; right: 10px; bottom: 8px; z-index: 3;
    font: 11.5px/1 ui-monospace, Consolas, monospace; color: var(--dim);
    pointer-events: none; letter-spacing: .2px;
  }
  .meter b { color: var(--accent); font-weight: 600; }

  /* ---------- 控制面板 ---------- */
  .panel {
    margin-top: 10px; padding: 9px 12px; border-radius: 12px;
    background: rgba(255, 255, 255, .04); border: 1px solid rgba(255, 255, 255, .1);
    display: flex; flex-wrap: wrap; gap: 7px 14px; align-items: center;
    font-size: 12.5px; color: #a9b6d1;
  }
  .panel label { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .panel input[type="range"] { width: 78px; accent-color: var(--accent); }
  .panel output { font: 11.5px/1 ui-monospace, Consolas, monospace; color: var(--ink); min-width: 40px; }
  .seg { display: inline-flex; border: 1px solid rgba(255, 255, 255, .12); border-radius: 8px; overflow: hidden; }
  .seg button {
    padding: 4px 10px; font: 12px/1.4 system-ui, sans-serif; cursor: pointer;
    color: #a9b6d1; background: transparent; border: 0; border-right: 1px solid rgba(255, 255, 255, .1);
  }
  .seg button:last-child { border-right: 0; }
  .seg button[aria-pressed="true"] { background: rgba(247, 185, 85, .18); color: var(--accent); font-weight: 650; }
  .chk { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .chk input { accent-color: var(--accent); }
  p.hint { margin: 8px 0 0; color: #6c7893; font-size: 11.5px; }
  code { font: 11.5px ui-monospace, Consolas, monospace; color: #b8c6e6; }

  /* 减少动效偏好：默认不飞粒子（JS 里也会把「静止」勾上） */
  @media (prefers-reduced-motion: reduce) {
    .burst { transition: none; }
  }
</style>
</head>
<body>
  <h2>点击撒花 Confetti Burst</h2>
  <p class="note">点大按钮爆发一次；在灰色画布上按住拖动会洒出一小串（跟随用法）。</p>

  <div class="stage" id="stage">
    <canvas id="cv" aria-hidden="true"></canvas>
    <button class="burst" id="burstBtn">庆祝一下 🎊</button>
    <div class="meter" id="meter">粒子 <b>0</b>/400 · <b>0</b> fps</div>
  </div>

  <div class="panel">
    <label>数量
      <input type="range" id="sCount" min="20" max="400" step="10" value="180" aria-label="每次爆发的粒子数量">
      <output id="oCount">180</output>
    </label>
    <label>重力
      <input type="range" id="sGrav" min="200" max="3000" step="50" value="1400" aria-label="重力加速度">
      <output id="oGrav">1400</output>
    </label>
    <span class="seg" role="group" aria-label="碎片形状">
      <button type="button" id="bPaper" aria-pressed="true">纸片</button>
      <button type="button" id="bDot" aria-pressed="false">圆形</button>
      <button type="button" id="bStar" aria-pressed="false">星形</button>
    </span>
    <label class="chk"><input type="checkbox" id="cAuto"> 每 2 秒自动爆发</label>
    <label class="chk"><input type="checkbox" id="cStill"> 静止（停 rAF）</label>
  </div>
  <p class="hint">把重力拉到 <code>200</code> 再看形状切到「纸片」——翻面感全靠 <code>width * cos(tilt)</code>。</p>

<script>
(function () {
  'use strict';

  /* ============ 常量与状态 ============ */
  var CAP = 400;                                  // 硬性上限，超出直接丢弃新粒子
  var PALETTE = ['#f7b955', '#ff5f9e', '#24d3ee', '#35d18e', '#7c5cff', '#ffffff', '#ff7a5c'];
  var CFG = {
    count: 180,
    g: 1400,        // px/s²：重力加速度（用「每秒」而不是「每帧」）
    drag: 0.985,    // 每 60fps 帧的水平空气阻力系数
    shape: 'paper', // paper | dot | star
    auto: false,
    still: false
  };

  var stage = document.getElementById('stage');
  var cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');                  // 注意：没有传 willReadFrequently
  var meter = document.getElementById('meter');
  var btnBurst = document.getElementById('burstBtn');

  var W = 0, H = 0, DPR = 1;
  function resize() {
    var r = stage.getBoundingClientRect();
    W = Math.max(1, r.width); H = Math.max(1, r.height);
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(W * DPR);               // 位图尺寸 = CSS 尺寸 × DPR
    cv.height = Math.round(H * DPR);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
  }
  resize();
  window.addEventListener('resize', function () { resize(); wake(); });

  /* ============ 粒子 ============ */
  var parts = [];
  function make(x, y, soft) {
    var a = -Math.PI / 2 + (Math.random() - 0.5) * 1.6;
    var sp = (soft ? 60 + Math.random() * 90 : 280 + Math.random() * 430);
    return {
      x: x + (Math.random() - 0.5) * 12, y: y + (Math.random() - 0.5) * 12,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      rot: Math.random() * 6.2832, vr: (Math.random() - 0.5) * 12,
      w: 6 + Math.random() * 8, h: 4 + Math.random() * 5,
      tilt: Math.random() * 6.2832,               // 纸片「绕自身长轴翻转」的相位
      ts: 4 + Math.random() * 6,                  // 翻转角速度 rad/s
      color: PALETTE[(Math.random() * PALETTE.length) | 0],
      age: 0
    };
  }
  function burst(x, y, n, soft) {
    if (CFG.still) return 0;
    var room = CAP - parts.length;                // 上限保护：不扩容、不排队
    n = Math.max(0, Math.min(n, room));
    for (var i = 0; i < n; i++) parts.push(make(x, y, soft));
    wake();
    return n;
  }
  function fromButton(n) {
    var b = btnBurst.getBoundingClientRect(), s = stage.getBoundingClientRect();
    burst(b.left - s.left + b.width / 2, b.top - s.top + b.height / 2, n, false);
  }

  /* ============ 物理步进 ============ */
  function step(dtN, dtS) {
    var dragF = Math.pow(CFG.drag, dtN);          // 帧率无关的阻力：0.985^dtN
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.vy += CFG.g * dtS;                        // 重力：加速度 × 秒
      p.vx *= dragF;                              // 空气阻力（只作用水平，纸片会「飘」）
      p.x += p.vx * dtS;
      p.y += p.vy * dtS;
      p.rot += p.vr * dtN;
      p.tilt += p.ts * dtS;
      p.age += dtS;
      if (p.age > 6 || p.y > H + 40 || p.x < -60 || p.x > W + 60) {
        parts[i] = parts[parts.length - 1];       // swap-and-pop：不 splice、不 filter
        parts.pop();
      }
    }
  }

  function starPath(ctx, r) {
    for (var i = 0; i < 10; i++) {
      var rad = (i % 2 ? r * 0.46 : r), a = i * Math.PI / 5 - Math.PI / 2;
      ctx[i ? 'lineTo' : 'moveTo'](Math.cos(a) * rad, Math.sin(a) * rad);
    }
    ctx.closePath();
  }

  /* ============ 绘制 ============ */
  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < parts.length; i++) {
      var p = parts[i];
      ctx.fillStyle = p.color;
      if (CFG.shape === 'paper') {
        /* --- 伪造 3D 翻面的关键一行：宽度 = w * cos(tilt) --- */
        var pw = p.w * Math.cos(p.tilt);
        var c = Math.cos(p.rot), s = Math.sin(p.rot);
        ctx.setTransform(DPR * c, DPR * s, -DPR * s, DPR * c, DPR * p.x, DPR * p.y);
        ctx.fillRect(-pw / 2, -p.h / 2, pw, p.h);  // pw 为负时矩形反向延伸 = 翻到背面
      } else if (CFG.shape === 'dot') {
        ctx.setTransform(DPR, 0, 0, DPR, DPR * p.x, DPR * p.y);
        ctx.beginPath();
        ctx.arc(0, 0, p.w * 0.45, 0, 6.2832);
        ctx.fill();
      } else {
        var c2 = Math.cos(p.rot), s2 = Math.sin(p.rot);
        ctx.setTransform(DPR * c2, DPR * s2, -DPR * s2, DPR * c2, DPR * p.x, DPR * p.y);
        starPath(ctx, p.w * 0.62);
        ctx.fill();
      }
    }
  }

  /* ============ 主循环：只在有粒子时排帧 ============ */
  var raf = null, last = 0, fps = 0;
  function frame(t) {
    var ms = last ? t - last : 16.7;
    ms = Math.min(ms, 40);                        // 夹住一帧：切后台回来不能瞬移
    last = t;
    step(ms / 16.6667, ms / 1000);
    draw();
    if (ms > 0) fps += (1000 / ms - fps) * 0.12;
    showMeter();
    if (parts.length && !CFG.still) raf = requestAnimationFrame(frame);
    else { raf = null; last = 0; fps = 0; showMeter(); }   // 粒子清空 -> rAF 停，读数归零
  }
  function wake() {
    if (CFG.still) { parts.length = 0; showMeter(); clearCanvas(); return; }
    if (!raf) { last = 0; raf = requestAnimationFrame(frame); }
  }
  function clearCanvas() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
  }
  function showMeter() {
    meter.innerHTML = '粒子 <b>' + parts.length + '</b>/' + CAP +
      ' · <b>' + Math.round(fps) + '</b> fps';
  }

  /* ============ 交互：爆发 + 跟随拖尾 ============ */
  btnBurst.addEventListener('click', function () { fromButton(CFG.count); });

  var trail = 0, lx = 0, ly = 0, hasLast = false;
  stage.addEventListener('pointermove', function (e) {
    var r = stage.getBoundingClientRect();
    var x = e.clientX - r.left, y = e.clientY - r.top;
    if (hasLast) {
      trail += Math.hypot(x - lx, y - ly);
      /* 按「距离」而不是按「时间」节流：鼠标快慢都能洒出等间距的一串 */
      while (trail > 9) { trail -= 9; burst(x, y, 1, true); }
    }
    lx = x; ly = y; hasLast = true;
  }, { passive: true });
  stage.addEventListener('pointerleave', function () { hasLast = false; trail = 0; });

  /* 自动爆发：用 setTimeout 而不是让 rAF 空转等下一波 */
  var autoTimer = null;
  function loopAuto() {
    autoTimer = setTimeout(function () {
      var r = stage.getBoundingClientRect();
      burst(40 + Math.random() * (r.width - 80), r.height * 0.45, CFG.count / 2 | 0, false);
      loopAuto();
    }, 2000);
  }
  function setAuto(on) {
    CFG.auto = on;
    clearTimeout(autoTimer); autoTimer = null;
    if (on && !CFG.still) loopAuto();
  }

  /* ============ 面板绑定 ============ */
  function bindRange(id, outId, key) {
    var inp = document.getElementById(id), out = document.getElementById(outId);
    out.textContent = inp.value;
    inp.addEventListener('input', function () {
      CFG[key] = parseFloat(inp.value);
      out.textContent = inp.value;
    });
  }
  bindRange('sCount', 'oCount', 'count');
  bindRange('sGrav', 'oGrav', 'g');

  var shapeBtns = { paper: document.getElementById('bPaper'), dot: document.getElementById('bDot'), star: document.getElementById('bStar') };
  Object.keys(shapeBtns).forEach(function (k) {
    shapeBtns[k].addEventListener('click', function () {
      CFG.shape = k;
      Object.keys(shapeBtns).forEach(function (j) { shapeBtns[j].setAttribute('aria-pressed', String(j === k)); });
      if (parts.length) wake();
    });
  });

  document.getElementById('cAuto').addEventListener('change', function () { setAuto(this.checked); });
  var stillBox = document.getElementById('cStill');
  stillBox.addEventListener('change', function () {
    CFG.still = this.checked;
    btnBurst.disabled = CFG.still;
    if (CFG.still) { setAuto(false); document.getElementById('cAuto').checked = false; parts.length = 0; showMeter(); clearCanvas(); }
    else wake();
  });

  /* 系统「减少动效」：默认进入静止态，用户仍可手动取消 */
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) {
    stillBox.checked = true;
    stillBox.dispatchEvent(new Event('change'));
  }

  /* 首屏给一次小爆发，别让用户先点一下才看到东西 */
  setTimeout(function () { fromButton(70); }, 260);
})();
</script>
</body>
</html>
